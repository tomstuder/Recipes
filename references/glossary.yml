# Glossary shown on the References page. Kept in A–Z order; definitions can use Markdown.

terms:
  - term: Autolyse
    definition: Resting just the flour and water (before the salt and levain go in) for 20–60 minutes, so the flour hydrates and gluten starts forming on its own.
  - term: Baker's percentage
    definition: Each ingredient as a percentage of the total flour weight, which counts as 100%. Makes formulas easy to compare and scale.
  - term: Banneton
    definition: A cane or wicker basket, often cloth-lined, that holds shaped dough during its final proof.
  - term: Biga
    definition: A stiff Italian preferment, usually 50–60% hydration, made with a little commercial yeast and fermented 12–16 hours.
  - term: Bulk fermentation
    definition: The first rise, after mixing and before dividing and shaping, when the whole batch ferments together. Strength is built here with folds.
  - term: Crumb
    definition: "The inside of the loaf: its texture and the size and pattern of its holes."
  - term: Desired dough temperature
    definition: The target temperature of the dough right after mixing, often 75–78°F (24–26°C). Mostly controlled with the water temperature.
  - term: Discard
    definition: Starter removed before a feeding. Still useful in recipes like pancakes, crackers or banana bread.
  - term: Hydration
    definition: Water as a percentage of flour weight. *Overall* hydration also counts the water in the levain and in ingredients like milk and eggs.
  - term: Inoculation
    definition: How much starter or levain goes into the dough, as a baker's percentage. More inoculation means faster fermentation.
  - term: Lamination
    definition: Stretching dough paper-thin on the counter and folding it back up; in pastry, folding a butter block into dough to build layers.
  - term: Levain
    definition: A sourdough preferment built from a little starter, flour and water, made specifically for one bake.
  - term: Oven spring
    definition: The quick rise in the first minutes of baking as gas expands and the yeast makes a last burst of activity.
  - term: Poolish
    definition: A wet preferment (100% hydration) made with a pinch of commercial yeast and fermented 12–16 hours.
  - term: Preferment
    definition: Part of the flour and water fermented ahead of time (levain, poolish or biga) to add flavor and strength.
  - term: Proof
    definition: The final rise, after shaping and before baking.
  - term: Retard
    definition: Slowing fermentation by chilling the dough, usually overnight in the fridge, for flavor and an easier schedule.
  - term: Scoring
    definition: Cutting the surface of the loaf just before baking so it opens where you want it to.
  - term: Starter
    definition: An ongoing culture of wild yeast and bacteria, kept alive with regular feedings of flour and water.
  - term: Stretch and fold
    definition: Pulling one side of the dough up and folding it over itself, working around the bowl, to build strength during bulk fermentation.
  - term: Windowpane test
    definition: Stretching a small piece of dough thin enough to see light through without tearing, a sign of well-developed gluten.
